name: ci
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: ci-admin-pw, TZ: UTC }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      TEST_PG_ADMIN_PASSWORD: ci-admin-pw
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx prisma generate
      - name: "Typecheck, lint, integration tests (real PostgreSQL: RLS, triggers, grants)"
        run: npm run check
      - name: Production build
        run: npm run build
        env:
          APP_URL: https://app.example.test
      - name: Dependency audit (fail on high/critical in runtime deps)
        run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build images (no push)
        run: |
          docker build --target runtime -t websekolah-app:ci .
          docker build --target migrate -t websekolah-migrate:ci .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with: { image-ref: websekolah-app:ci, severity: "HIGH,CRITICAL", exit-code: "1", ignore-unfixed: true }
