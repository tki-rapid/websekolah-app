# Optional: PostgreSQL in Docker instead of scripts/dev-db.sh. `docker compose up -d db`, then:
#   DATABASE_URL_MIGRATE=postgresql://ws_migrator:dev-migrator-pw@127.0.0.1:54329/websekolah npx prisma migrate deploy
services:
  db:
    image: postgres:16-alpine
    ports: ["127.0.0.1:54329:5432"]
    environment:
      POSTGRES_PASSWORD: dev-admin-pw
      POSTGRES_DB: websekolah
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/db-bootstrap.sql:/sql/db-bootstrap.sql:ro
      - ./scripts/docker-init.sh:/docker-entrypoint-initdb.d/10-bootstrap.sh:ro
volumes:
  pgdata:
